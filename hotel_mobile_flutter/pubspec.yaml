name: hotel_booking_mobile
description: "PRM393 Hotel Management & Booking Mobile App using Clean Architecture and Provider."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (Chuẩn giáo trình PRM393)
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.2.7

  # Local Storage & Persistence (Đáp ứng tiêu chí môn học)
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
